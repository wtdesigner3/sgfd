name: Deploy to seotycoons.in/sgdev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: 🚀 Fast Deploy to Test Server (seotycoons.in/sgdev)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Package Site into deploy.zip
        run: |
          echo "Packaging site files into deploy.zip..."
          zip -r -q deploy.zip . \
            -x ".git/*" \
            -x ".git*" \
            -x ".github/*" \
            -x "scratch/*" \
            -x "testpng/*" \
            -x "uploads12/*" \
            -x "uploads/bakupimage/*" \
            -x "mail/uploads/badges/*" \
            -x "mail/uploads/qrcodes/*" \
            -x "*.zip" \
            -x "*.rar" \
            -x "*.tar.gz" \
            -x "README.md"
          ls -lh deploy.zip

      - name: 🔑 Prepare Deployment Token & Unpacker
        run: |
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> $GITHUB_ENV
          echo "$DEPLOY_TOKEN" > .deploy_token
          cp .github/deploy_unpacker.php ./deploy_unpacker.php
          echo "Token and unpacker ready."

      - name: 🚀 Upload Archive & Unpacker via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python .github/ftp_upload.py

      - name: ⚡ Unpack on Server
        run: |
          echo "Triggering deploy_unpacker.php on server via HTTPS..."
          UNPACK_URL="https://seotycoons.in/sgdev/deploy_unpacker.php?token=${{ env.DEPLOY_TOKEN }}"
          UNPACKED=false

          for attempt in 1 2 3; do
            echo "Attempt $attempt to trigger server unpacker..."
            RESPONSE=$(curl -s -k --connect-timeout 8 --max-time 30 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              "$UNPACK_URL" || true)

            if [[ "$RESPONSE" == *"SUCCESS"* ]]; then
              echo "🎉 Site deployed and extracted cleanly in seconds!"
              UNPACKED=true
              break
            fi
            sleep 2
          done

          if [ "$UNPACKED" = true ]; then
            echo "✅ Deployment fully unpacked and live!"
          else
            echo "ℹ️ Direct web trigger did not return SUCCESS (server firewall drops inbound connections from Azure cloud runner IPs)."
            echo "📦 Archive 'deploy.zip' is safely uploaded on the server."
            echo "⚡ The built-in auto-extractor will unpack files automatically upon first visit to https://seotycoons.in/sgdev/."
          fi
