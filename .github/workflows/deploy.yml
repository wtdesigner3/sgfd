name: Deploy to seotycoons.in/sgdev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: 🚀 Fast Deploy to Test Server (seotycoons.in/sgdev)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Package Site into deploy.zip
        run: |
          echo "Packaging site files into deploy.zip..."
          zip -r -q deploy.zip . \
            -x ".git/*" \
            -x ".git*" \
            -x ".github/*" \
            -x "scratch/*" \
            -x "testpng/*" \
            -x "uploads12/*" \
            -x "uploads/bakupimage/*" \
            -x "mail/uploads/badges/*" \
            -x "mail/uploads/qrcodes/*" \
            -x "*.zip" \
            -x "*.rar" \
            -x "*.tar.gz" \
            -x "README.md"
          ls -lh deploy.zip

      - name: 🔑 Prepare Deployment Token & Unpacker
        run: |
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> $GITHUB_ENV
          echo "$DEPLOY_TOKEN" > .deploy_token
          cp .github/deploy_unpacker.php ./deploy_unpacker.php
          echo "Token and unpacker ready."

      - name: 🚀 Upload Archive & Unpacker via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python .github/ftp_upload.py

      - name: ⚡ Unpack on Server
        run: |
          echo "Calling deploy_unpacker.php on server..."
          RESPONSE=$(curl -s -k "http://seotycoons.in/sgdev/deploy_unpacker.php?token=${{ env.DEPLOY_TOKEN }}" || true)
          echo "Server response: $RESPONSE"

          if [[ "$RESPONSE" == *"SUCCESS"* ]]; then
            echo "🎉 Site deployed and extracted cleanly in seconds!"
          else
            echo "⚠️ Trying HTTPS endpoint..."
            RESPONSE_HTTPS=$(curl -s -k "https://seotycoons.in/sgdev/deploy_unpacker.php?token=${{ env.DEPLOY_TOKEN }}" || true)
            echo "HTTPS response: $RESPONSE_HTTPS"
            if [[ "$RESPONSE_HTTPS" == *"SUCCESS"* ]]; then
              echo "🎉 Site deployed and extracted cleanly via HTTPS!"
            else
              echo "❌ Error unpacking files. Direct response:"
              curl -i -k "http://seotycoons.in/sgdev/deploy_unpacker.php?token=${{ env.DEPLOY_TOKEN }}" || true
              exit 1
            fi
          fi
