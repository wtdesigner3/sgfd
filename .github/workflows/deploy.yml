name: Deploy to seotycoons.in/sgdev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: 🚀 Deploy to Test Server (seotycoons.in/sgdev)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 🚀 Sync files via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -f
          TARGET_DIR="${FTP_SERVER_DIR:-.}"
          echo "Deploying to FTP Server: $FTP_SERVER"
          echo "Target directory setting: $TARGET_DIR"

          # Configure ~/.netrc
          printf "machine %s\nlogin %s\npassword %s\ndefault\nlogin %s\npassword %s\n" \
            "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          CD_CMD=""
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "/" ] && [ "$TARGET_DIR" != "." ]; then
            CD_CMD="cd \"$TARGET_DIR\" || true;"
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 60;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            $CD_CMD
            pwd;
            mirror -R -v -c --only-newer --parallel=2 -X .git/ -X .git* -X .github/ -X scratch/ -X testpng/ -X uploads12/ -X uploads/bakupimage/ -X mail/uploads/badges/ -X mail/uploads/qrcodes/ -X *.zip -X *.rar -X *.tar.gz -X .ftp-deploy-sync-state.json -X README.md . .;
            bye;
          "
